spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:petsapp_dev}
    username: ${POSTGRES_USER:petsapp}
    password: ${POSTGRES_PASSWORD}

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-min-32-chars-long-replace-in-prod}
  storage:
    type: minio
    endpoint: http://localhost:9000
    bucket: petsapp-dev
    access-key: ${MINIO_ROOT_USER:petsapp_minio}
    secret-key: ${MINIO_ROOT_PASSWORD}
  frontend-url: http://localhost:3000
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8081

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
