spring:
  application:
    name: petsapp-backend

  # Datasource — konkretne wartosci w application-dev.yml / application-prod.yml
  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    # Flyway zarzadza schematem — ddl-auto musi byc validate lub none
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      timeout: 2000ms

  mail:
    default-encoding: UTF-8

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

# SpringDoc / Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# API prefix
server:
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-stacktrace: never

# Actuator — tylko health endpoint jest publiczny
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /internal
  endpoint:
    health:
      show-details: never

# Google OAuth2 — Client ID weryfikowany po stronie serwera
# Wartosc pochodzi z GOOGLE_CLIENT_ID env var (application-dev.yml / prod)
# Pusty default — w testach GoogleTokenVerifierImpl nie jest tworzony (Profile!test)
google:
  client-id: ${GOOGLE_CLIENT_ID:}

# Logging
logging:
  level:
    root: INFO
    com.petsapp: DEBUG
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Application-specific settings
app:
  jwt:
    access-token-expiration-ms: 900000       # 15 minut
    refresh-token-expiration-ms: 604800000   # 7 dni
  upload:
    max-size-bytes: 10485760                 # 10 MB
    allowed-mime-types:
      - image/jpeg
      - image/png
      - image/webp
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000}
# Firebase — push notifications przez FCM
# firebase.enabled=false w dev/test — nie wymaga konfiguracji credentials
firebase:
  enabled: false
  credentials-file: ${FIREBASE_CREDENTIALS_FILE:}